<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <style>
        body {
            margin-top: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        div {
            background-color: aliceblue;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        form {
            text-align: left;
        }

        label {
            display: inline-block;
            width: 80px;
            margin-right: 15px;
            font-weight: bold;
        }

        input {
            width: 220px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            display: block;
            margin: 10px auto;
            padding: 10px 100px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p {
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <form>
            <label>Name:</label>
            <input type="text" placeholder="enter your name"><br><br>

            <label>Email:</label>
            <input text="email" placeholder="enter your name"><br><br>

            <label>passward:</label>
            <input text="passward" placeholder="enter your passward"><br><br>

            <label>confirm passward:</label>
            <input text="passward" placeholder="enter your passward"><br><br>

            <button>Register</button>

            <p>I have an account?  <a href="log in.html">Login</a></p>

        </form>
    </div>
</body>
</html>
