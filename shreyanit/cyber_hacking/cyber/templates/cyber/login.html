<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Georgia, 'Times New Roman', serif;
            /* background: linear-gradient(150deg, black, white); */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container{
            width: 30%;
            min-height: 40vh;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap:30px;
            border-radius: 20px;
            line-height: 1.6;
            padding: 30px;
            box-shadow: 0 0 20px rgb(0 0 0);
        }

        h1{
            font-size: 50px;
        }
        
        form {
            width:80%;
        }

        form div{
            margin-bottom: 15px;
            display: flex;
            text-align: center;
        }
        label{
            width: 100px;
            text-align: left;
        }

        input{
            width: 300px;
            border-radius: 4px;
            padding: 6px;
            background-color: white;
            border: 1px solid black
        }

        .forgot a{
            width: 100%;
            text-align: right;
            color: black;
        }

        .login a{
            width: 100%;
            text-align: center;
            background-color: rgb(46, 136, 214);
            color: white;
            text-decoration: none;
            font-size: 20px;
            
        }

        div p{
            width: 100%;
            text-align: center;
        }

        span{
            text-decoration: none;
            color: rgb(35, 84, 192);
            font-weight: bolder;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Login</h1>
        <form>
            <div>
                <label>Email:</label>
                <input type="email" name="email" placeholder="enter your email">
            </div>
            <div>
                <label>password:</label>
                <input type="password" name="password" placeholder="enter your password">
            </div>
            <div class="forgot">
                <a href="f_p.html">Forgot Password?</a>
            </div>
            <div class="login">
                <a href="/home/">Login</a>
            </div>
            <div>
                <p>Don't have an account?<a href="/register/"><span>SignUp for free!</span></a></p>
            </div>
        </form>
    </div>
</body>

</html>
