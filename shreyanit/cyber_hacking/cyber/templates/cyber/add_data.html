<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif;
            margin: 20px;
            background: linear-gradient(100deg, blue, green);
        }

        h1 {
            background-color: black;
            color: orangered;
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
        }

        nav {
            margin-top: 20px;
            background-color: orangered;
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-weight: bolder;
            font-size: 20px;
        }

        nav a:hover {
            text-decoration: underline;
            color: blue;
            background-color: orangered;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Modeling and Prediciting Cyber Hacking Breaches</h1>
        <nav>
            <a href="analysis.html">ANALYSIS</a>
            <a href="add_data.html">ADD DATA</a>
            <a href="malware_data.html">MALWARE DATA</a>
            <a href="unmalware_data.html">UNMALWARE DATA</a>
            <a href="breaches_analysis.html">BREACHES ANALYSIS</a>
            <a href="graphical_analysis.html">GRAPHICAL ANALYSIS</a>
            <a href="/login/">LOGOUT</a>
        </nav>
    </div>
    {% if request.GET.tab == 'add_data' %}
    <div class="simple-form">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group"><label>ENTITY:</label><input type="text" name="entity"></div>
            <div class="form-group"><label>YEAR:</label><input type="text" name="year"></div>
            <div class="form-group"><label>RECORDS:</label><input type="text" name="records"></div>
            <div class="form-group"><label>ORG TYPE:</label><input type="text" name="org_type"></div>
            <div class="form-group"><label>METHODS:</label><input type="text" name="methods"></div>
            <div class="form-group"><label>ADD DATA:</label><input type="text" name="add_data"></div>
            <div class="form-group"><label>TIME:</label><input type="text" name="time"></div>
            <button type="submit" class="submit-btn">SUBMIT</button>
        </form>
    </div>
</body>

</html>
