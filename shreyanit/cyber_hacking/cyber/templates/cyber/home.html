{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif;
            margin: 20px;
            background: linear-gradient(100deg, blue, green);
        }

        h1 {
            background-color: black;
            color: orangered;
            text-align: center;
            padding: 10px;
            margin-bottom: 10px;
        }

        nav {
            margin-top: 20px;
            background-color: orangered;
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-weight: bolder;
            font-size: 20px;
        }

        nav a:hover {
            text-decoration: underline;
            color: blue;
            background-color: orangered;
        }

        .dashboard{
            display: flex;
            gap: 30px;
            width: 100%;
        }

        .chartsheet{
            width: 88%;
            background-color: white;
            margin-top: 30px;
        }

        .chartsheet img{
            width: 100%;
        }

        .side-bar{
            width:22%;
            min-height: 65vh;
            margin-top: 30px;
            background-color: blue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 100px;
            padding: 100px 0;
        }

        .side-bar a{
            color: white;
            font-size: 30px;
            text-decoration: none;
        }
    </style>
</head>
