<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <style>
        body {
            margin: 0;
            margin-top: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1{
            font-size: 40px;
        }

        div {
            background-color: aliceblue;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.2);
        }

        form {
            text-align: left;
        }

        label {
            display: inline-block;
            width: 80px;
            margin-right: 15px;
            font-weight: bold;
        }

        input {
            width: 220px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            display: block;
            margin: 10px auto;
            padding: 10px 100px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Login</h1>
    <div>
        <form>
            <label>Email: </label>
            <input type="email" placeholder="enter your username"><br><br>

            <label>passward: </label>
            <input text="passward" placeholder="enter your passward"><br><br>

            <a href="passward.html">Forgot Passward?</a><br><br>

            <a href="/home/"><button>Login</button></a>

            <p>Don't have an account? <a href="register.html">Sign Up</a></p>
        </form>
    </div>
</body>

</html>
